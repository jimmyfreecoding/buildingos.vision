name: buildingos-vision
services:
  # 流媒体中转 (ZLMediaKit)
  zlm:
    image: zlmediakit/zlmediakit:master
    ports:
      - "10081:80"     # API 及静态文件。注意：不要使用10080
      - "10554:554"    # RTSP 流
      - "11935:1935"   # RTMP 流
      - "18080:8080"   # HTTP-FLV/WS-FLV
    environment:
      # 通过环境变量设置 ZLM 的全局秘钥
      - ZLM_API_SECRET=buildingos_edge_secret_2026
    # 启动前通过 sed 自动将环境变量中的密钥同步到 config.ini 中，实现零接触配置
    command: >
      sh -c "sed 's/^secret=.*/secret='\"$$ZLM_API_SECRET\"'/g' /opt/media/conf/config.ini > /tmp/config.ini && cat /tmp/config.ini > /opt/media/conf/config.ini && /opt/media/bin/MediaServer -c /opt/media/conf/config.ini"
    volumes:
      - zlm_www_data:/opt/media/www/
      # 映射配置文件以便持久化和自动修改
      - ./zlm/config.ini:/opt/media/conf/config.ini
    restart: always

  # 前端请求代理网关 (Nginx) - 用于托管 Web 界面并代理 /api
  web-nginx:
    image: nginx:alpine
    ports:
      - "10082:80"
    volumes:
      - web_frontend_data:/usr/share/nginx/html # 挂载前端专用的卷
      - ./web_manager/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-manager-frontend-deploy
      - web-manager-backend
    restart: always

  # 前端自动构建与部署任务 (执行完即退出)
  web-manager-frontend-deploy:
    build:
      context: ./web_manager/frontend
      dockerfile: Dockerfile
    volumes:
      - web_frontend_data:/target_www/ # 将编译后的 dist 放入 Nginx 的专用卷

  # AI 推理引擎 (关键，使用 GPU)
  ai-engine:
    build: 
      context: ./ai_engine
      dockerfile: Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # MQTT_BROKER 移除硬编码，优先使用 config.json 中的配置
      - ZLM_API=http://zlm:80/index/api
      # 让 AI 引擎读取相同的秘钥环境变量
      - ZLM_SECRET=buildingos_edge_secret_2026
    extra_hosts:
      - "emqx:host-gateway"
    volumes:
      - ./ai_engine/models:/app/models
      # 移除写死的旧配置挂载路径，保持全局统一
      - ./ai_engine/config:/app/ai_engine/config
      # 挂载源码目录，方便开发时修改代码立即生效（重启容器即可）
      - ./ai_engine/src:/app/src
      - zlm_www_data:/app/www # 仍然挂载 zlm_www_data 用于保存截图和视频
    depends_on:
      - zlm
    restart: always

  # 业务逻辑编排 (Node-RED)
  node-red:
    image: nodered/node-red:latest
    ports:
      - "11880:1880"
    volumes:
      - node_red_data:/data # 使用命名卷
    restart: always

  # 边缘网关管理系统后端 (Web Manager API)
  web-manager-backend:
    build:
      context: ./web_manager/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # 允许控制重启容器
      - ./:/host_project                            # 允许执行 git pull / compose 操作
      # 修复：直接将宿主机的配置文件目录挂载进来，不使用命名卷以避免初始化为空
      - ./ai_engine/config:/app/ai_engine/config
      - zlm_www_data:/app/www # 挂载静态文件目录以读取算法日志
    restart: always

  # Docker 可视化管理 (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

# 声明所有的命名卷 (Docker 自动管理权限，物理存储在 /var/lib/docker/volumes/)
volumes:
  zlm_www_data:
  web_frontend_data:
  node_red_data:
  portainer_data:
