name: buildingos-vision
services:
  # 流媒体中转 (ZLMediaKit)
  zlm:
    image: zlmediakit/zlmediakit:master
    ports:
      - "10081:80"     # API 及静态文件。注意：不要使用10080
      - "10554:554"    # RTSP 流
      - "11935:1935"   # RTMP 流
      - "18080:8080"   # HTTP-FLV/WS-FLV
    environment:
      # 通过环境变量设置 ZLM 的全局秘钥
      - ZLM_API_SECRET=buildingos_edge_secret_2026
    # 启动前通过 sed 自动将环境变量中的密钥同步到 config.ini 中，实现零接触配置
    # 注意：因为我们将宿主机的文件挂载为了只读文件或者受宿主机权限保护，所以这里将其复制一份到临时目录修改并使用
    command: >
      sh -c "cp /opt/media/conf/config.ini /tmp/config.ini && sed -i 's/^secret=.*/secret='\"$$ZLM_API_SECRET\"'/g' /tmp/config.ini && /opt/media/bin/MediaServer -c /tmp/config.ini"
    volumes:
      - zlm_www_data:/opt/media/www/
      # 挂载配置目录而不是单一文件，防止 sed 修改文件 inode 导致 docker 挂载断裂
      - ./zlm:/opt/media/conf
    restart: always

  # 前端请求代理网关 (Nginx) - 用于托管 Web 界面并代理 /api
  web-nginx:
    image: nginx:alpine
    ports:
      - "10082:80"
    volumes:
      - web_frontend_data:/usr/share/nginx/html # 挂载前端专用的卷
      - ./web_manager/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-manager-frontend-deploy
      - web-manager-backend
    restart: always

  # 前端自动构建与部署任务 (执行完即退出)
  web-manager-frontend-deploy:
    build:
      context: ./web_manager/frontend
      dockerfile: Dockerfile
    volumes:
      - web_frontend_data:/target_www/ # 将编译后的 dist 放入 Nginx 的专用卷

  # AI 推理引擎 (关键，使用 GPU)
  ai-engine:
    build: 
      context: ./ai_engine
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, utility]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # MQTT_BROKER 移除硬编码，优先使用 config.json 中的配置
      - ZLM_API=http://zlm:80/index/api
      # 统一使用 ZLM_API_SECRET 环境变量
      - ZLM_API_SECRET=buildingos_edge_secret_2026
      # 修复 Ultralytics 配置目录不可写警告，挂载到统一缓存或直接使用容器内 /tmp
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      # 为了支持更深层的嵌套权限，使用临时根目录作为缓存
      - XDG_CONFIG_HOME=/tmp
      # 同步宿主机时区到容器内 (Houston Time)
      - TZ=America/Chicago
    extra_hosts:
      - "emqx:host-gateway"
      - "host.docker.internal:host-gateway"
      - "buildingos-emqx-prod:host-gateway"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./scripts:/app/scripts:ro
      - ./ai_engine/models:/app/models
      # 移除写死的旧配置挂载路径，保持全局统一
      - ./ai_engine/config:/app/ai_engine/config
      # 挂载源码目录，方便开发时修改代码立即生效（重启容器即可）
      - ./ai_engine/src:/app/src
      - zlm_www_data:/app/www # 仍然挂载 zlm_www_data 用于保存截图和视频
    depends_on:
      - zlm
    restart: always

  # 业务逻辑编排 (Node-RED)
  node-red:
    image: nodered/node-red:latest
    ports:
      - "11880:1880"
    extra_hosts:
      - "buildingos-emqx-prod:host-gateway"
    volumes:
      - node_red_data:/data # 使用命名卷
    restart: always

  # 边缘网关管理系统后端 (Web Manager API)
  web-manager-backend:
    build:
      context: ./web_manager/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # 统一使用 ZLM_API_SECRET 环境变量
      - ZLM_API_SECRET=buildingos_edge_secret_2026
    extra_hosts:
      - "buildingos-emqx-prod:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # 允许控制重启容器
      - ./:/host_project                            # 允许执行 git pull / compose 操作
      - /tmp:/host_tmp:ro
      # 修复：直接将宿主机的配置文件目录挂载进来，不使用命名卷以避免初始化为空
      - ./ai_engine/config:/app/ai_engine/config
      - zlm_www_data:/app/www # 挂载静态文件目录以读取算法日志
    restart: always

  # Docker 可视化管理 (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

# 声明所有的命名卷 (Docker 自动管理权限，物理存储在 /var/lib/docker/volumes/)
volumes:
  zlm_www_data:
  web_frontend_data:
  node_red_data:
  portainer_data:

# 定义自定义网络，避开 10.0.x.x 等常见物理局域网网段，防止路由冲突 (host is unreachable)
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
