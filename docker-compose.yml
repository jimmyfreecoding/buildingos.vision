name: buildingos-vision
services:
  # 流媒体中转 (ZLMediaKit) - 同时作为前端 Web 服务器
  zlm:
    image: zlmediakit/zlmediakit:master
    ports:
      - "10081:80"     # API 及静态文件 (包含我们的 Web Manager 前端)。注意：不要使用10080，会被浏览器拦截
      - "10554:554"    # RTSP 流
      - "11935:1935"   # RTMP 流
      - "18080:8080"   # HTTP-FLV/WS-FLV
    volumes:
      - ./zlm/config.ini:/opt/media/conf/config.ini
      - zlm_www_data:/opt/media/www/  # 使用命名卷，不再需要 chmod 777
    restart: always

  # 前端请求代理网关 (Nginx) - 用于托管 Web 界面并代理 /api
  web-nginx:
    image: nginx:alpine
    ports:
      - "10082:80"
    volumes:
      - web_frontend_data:/usr/share/nginx/html # 挂载前端专用的卷
      - ./web_manager/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-manager-frontend-deploy
      - web-manager-backend
    restart: always

  # 前端自动构建与部署任务 (执行完即退出)
  web-manager-frontend-deploy:
    build:
      context: ./web_manager/frontend
      dockerfile: Dockerfile
    volumes:
      - web_frontend_data:/target_www/ # 将编译后的 dist 放入 Nginx 的专用卷
    # 注意：这个任务不需要 depends_on zlm 了

  # AI 推理引擎 (关键，使用 GPU)
  ai-engine:
    build: 
      context: ./ai_engine
      dockerfile: Dockerfile
    runtime: nvidia
    environment:
      - MQTT_BROKER=emqx
      - ZLM_API=http://zlm:80/index/api/
    extra_hosts:
      - "emqx:host-gateway"
    volumes:
      - ./ai_engine/models:/app/models
      - ai_config_data:/app/config
      - zlm_www_data:/app/www # 仍然挂载 zlm_www_data 用于保存截图和视频
    depends_on:
      - zlm
    restart: always

  # 业务逻辑编排 (Node-RED)
  node-red:
    image: nodered/node-red:latest
    ports:
      - "11880:1880"
    volumes:
      - node_red_data:/data # 使用命名卷
    restart: always

  # 边缘网关管理系统后端 (Web Manager API)
  web-manager-backend:
    build:
      context: ./web_manager/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # 允许控制重启容器
      - ./:/host_project                            # 允许执行 git pull / compose 操作
      - ai_config_data:/app/ai_engine/config       # 挂载 AI 命名卷，允许后端读写 config.json
    restart: always

  # Docker 可视化管理 (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

# 声明所有的命名卷 (Docker 自动管理权限，物理存储在 /var/lib/docker/volumes/)
volumes:
  zlm_www_data:
  web_frontend_data:
  ai_config_data:
  node_red_data:
  portainer_data:
